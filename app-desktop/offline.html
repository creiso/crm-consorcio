<!doctype html>
<html lang="pt-BR">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>CRM Consórcio</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #0f172a; font-family: "Segoe UI", system-ui, sans-serif; }
  main { max-width: 380px; padding: 28px; text-align: center; background: #fff; border: 1px solid #e6e8ec; border-radius: 14px; }

  p { margin: 0 0 18px; color: #64748b; font-size: 14px; line-height: 1.5; }
  a { display: inline-block; padding: 9px 16px; border-radius: 9px; background: #e3262f; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
  a:hover { background: #c81e27; }
</style>
</head>
<body>
<main>
  <h1>Sem conexão com o CRM</h1>
  <p>Confira a internet deste computador. Quando a conexão voltar, o CRM abre sozinho.</p>
